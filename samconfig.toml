version = 0.1

[development.global.parameters]
stack_name = "tallynest-development"
region = "ap-southeast-1"

[development.build.parameters]
cached = true
parallel = true

[development.validate.parameters]
lint = true

[development.deploy.parameters]
capabilities = "CAPABILITY_IAM"
confirm_changeset = true
fail_on_empty_changeset = false
resolve_s3 = true
parameter_overrides = "Environment=development EnablePointInTimeRecovery=false"
